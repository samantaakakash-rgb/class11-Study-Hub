<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Class 11 Study Hub</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#171a2b;--muted:#6d7486;--p:#6257ee;--line:#e7e9f0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,Arial}.nav{height:70px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 6%;position:sticky;top:0;z-index:5}.brand{font-size:20px;font-weight:800}.brand b{color:var(--p)}button{cursor:pointer;border:0}.admin{background:#11152a;color:#fff;padding:10px 15px;border-radius:11px}.hero{max-width:1100px;margin:30px auto;padding:42px 28px;border-radius:28px;color:#fff;background:linear-gradient(135deg,#6257ee,#8b5cf6)}.hero h1{font-size:40px;margin:0 0 8px}.hero p{opacity:.9}.search{width:100%;max-width:650px;padding:16px;border:0;border-radius:14px;font-size:16px}.wrap{max-width:1100px;margin:auto;padding:25px 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:17px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:20px;box-shadow:0 8px 25px #0000000b}.card{cursor:pointer;transition:.2s}.card:hover{transform:translateY(-4px)}.icon{font-size:34px}.muted{color:var(--muted)}.pill{display:inline-block;background:#6257ee15;color:var(--p);padding:6px 9px;border-radius:8px;font-size:12px;font-weight:700;margin-top:12px}.back{background:var(--card);border:1px solid var(--line);padding:10px 14px;border-radius:10px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.pdf{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:13px;background:var(--card);display:flex;justify-content:space-between;align-items:center}.open{background:var(--p);color:white;padding:9px 12px;border-radius:9px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.box{background:var(--card);color:var(--text);width:min(560px,100%);padding:25px;border-radius:20px}.input{width:100%;padding:12px;margin:7px 0 14px;border:1px solid var(--line);border-radius:10px}.upload{background:var(--p);color:#fff;padding:12px 16px;border-radius:10px;font-weight:700}.danger{background:#ef4444;color:#fff;padding:8px 10px;border-radius:8px}.hidden{display:none}footer{text-align:center;color:var(--muted);padding:30px}
</style>
</head>
<body>
<div class="nav"><div class="brand">Class 11 <b>Study Hub</b></div><button class="admin" onclick="showAdmin()">⚙ Admin</button></div>
<section class="hero"><h1>Study smarter. 📚</h1><p>Class 11-এর notes ও PDF — subject অনুযায়ী এক জায়গায়।</p><input class="search" id="search" placeholder="🔎 Subject খুঁজুন..."></section>
<main class="wrap" id="home"><h2>Subjects</h2><p class="muted">একটি subject বেছে নাও</p><div class="grid" id="subjects"></div></main>
<main class="wrap hidden" id="subject"><button class="back" onclick="goHome()">← Subjects</button><h1 id="st"></h1><p class="muted" id="sd"></p><div id="pdfs"></div></main>
<footer>© 2026 Class 11 Study Hub</footer>

<div class="modal" id="modal"><div class="box">
<h2>🔐 Admin Upload</h2><p class="muted">এই demo-তে cloud connection না দেওয়া পর্যন্ত upload button কাজ করবে না।</p>
<label>Subject</label><select class="input" id="as"></select>
<label>Chapter / PDF name</label><input class="input" id="an" placeholder="যেমন: Chapter 1 Notes">
<label>PDF file</label><input class="input" id="af" type="file" accept=".pdf">
<div class="row"><button class="back" onclick="hideAdmin()">Cancel</button><button class="upload" onclick="upload()">☁ Upload PDF</button></div>
<p id="msg" class="muted"></p>
</div></div>

<script>
const S=[["বাংলা","📘"],["English","📗"],["Accountancy","📙"],["Business Studies","📕"],["Cost & Tax","📒"],["Economics","📓"]];
let data=JSON.parse(localStorage.getItem("studyDemo")||"{}");
function render(q=""){subjects.innerHTML=S.filter(x=>x[0].toLowerCase().includes(q.toLowerCase())).map((x,i)=>`<div class="card" onclick="openSub(${i})"><div class="icon">${x[1]}</div><h3>${x[0]}</h3><p class="muted">Notes, PDF ও Study Material</p><span class="pill">${(data[x[0]]||[]).length} PDFs</span></div>`).join("")}
render(); search.oninput=e=>render(e.target.value);
function openSub(i){home.classList.add("hidden");subject.classList.remove("hidden");let [n,ic]=S[i];st.textContent=ic+" "+n;sd.textContent="এই subject-এর available PDF";let arr=data[n]||[];pdfs.innerHTML=arr.length?arr.map(x=>`<div class="pdf"><span>📄 ${x.name}</span><a class="open" href="${x.url}" target="_blank">Open PDF</a></div>`).join(""):`<div class="panel"><b>এখনও কোনো PDF যোগ করা হয়নি।</b><p class="muted">Admin panel থেকে PDF যোগ করো।</p></div>`}
function goHome(){subject.classList.add("hidden");home.classList.remove("hidden");render(search.value)}
function showAdmin(){modal.style.display="flex";as.innerHTML=S.map(x=>`<option>${x[0]}</option>`).join("")}
function hideAdmin(){modal.style.display="none"}
function upload(){msg.textContent="Cloud storage connect না করলে browser থেকে PDF permanent online upload করা যাবে না। নিচের setup guide অনুসরণ করে Firebase/Supabase credentials বসাতে হবে।"}
</script>
</body></html>
